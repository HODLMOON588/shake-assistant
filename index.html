<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Shake — Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');
  :root { --black:#0a0a0a; --gold:#c9a84c; --cream:#f5f0e8; --cream-dark:#ede6d6; --text:#2c2418; --mid:#6b5d4a; --light:#9a8a72; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--text);height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
  header{background:var(--black);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#c9a84c,#e8c97a);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--black)}
  .h1{color:var(--cream);font-size:15px;font-weight:600}
  .h2{color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .dot-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--light)}
  .dot{width:7px;height:7px;border-radius:50%;background:#4caf75;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .chips{display:flex;gap:8px;padding:12px 14px 0;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;border:1.5px solid var(--cream-dark);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:500;background:white;color:var(--mid);cursor:pointer;white-space:nowrap;transition:all .15s}
  .chip:hover{background:var(--black);color:var(--gold);border-color:var(--black)}
  .chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
  .welcome{background:var(--black);border-radius:16px;padding:22px}
  .welcome h2{font-family:'Playfair Display',serif;font-size:20px;color:var(--cream);margin-bottom:8px}
  .welcome h2 em{color:var(--gold)}
  .welcome p{color:var(--mid);font-size:13px;line-height:1.6;margin-bottom:16px}
  .sugg-btn{display:block;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.2);border-radius:10px;padding:9px 13px;font-size:13px;color:#ede6d6;cursor:pointer;text-align:left;margin-bottom:8px;transition:all .15s}
  .sugg-btn:hover{background:rgba(201,168,76,.1);border-color:var(--gold);color:var(--gold)}
  .msg{display:flex;gap:9px;animation:fadeUp .3s ease}
  .msg.user{flex-direction:row-reverse}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .avatar{width:33px;height:33px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .avatar.bot{background:var(--black);border:1.5px solid var(--gold);color:var(--gold)}
  .avatar.usr{background:var(--gold);color:var(--black)}
  .bubble{max-width:76%;padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.65;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  .bubble.bot{background:white;color:var(--text);border-bottom-left-radius:4px}
  .bubble.user{background:var(--black);color:var(--cream);border-bottom-right-radius:4px}
  .typing{display:flex;gap:5px;padding:4px 0}
  .tdot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .tdot:nth-child(1){animation:b 1.2s 0s infinite}
  .tdot:nth-child(2){animation:b 1.2s .2s infinite}
  .tdot:nth-child(3){animation:b 1.2s .4s infinite}
  @keyframes b{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  .input-area{padding:10px 14px 20px;background:var(--cream);border-top:1px solid var(--cream-dark);flex-shrink:0}
  .input-row{display:flex;gap:9px;align-items:flex-end;background:white;border-radius:13px;padding:9px 11px;box-shadow:0 2px 14px rgba(0,0,0,.07);border:1.5px solid var(--cream-dark);transition:border-color .2s}
  .input-row:focus-within{border-color:var(--gold)}
  textarea{flex:1;border:none;outline:none;resize:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:transparent;max-height:100px;line-height:1.5}
  textarea::placeholder{color:var(--light)}
  #sendBtn{width:35px;height:35px;border-radius:9px;background:var(--black);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
  #sendBtn:hover{background:var(--gold)}
  #sendBtn:hover svg{fill:var(--black)}
  .disc{text-align:center;font-size:10px;color:var(--light);margin-top:7px}
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <div><div class="h1">Assistant Le Shake</div><div class="h2">Standards & Formation</div></div>
  <div class="dot-wrap"><div class="dot"></div><span>En ligne</span></div>
</header>

<div class="chips">
  <button class="chip" onclick="ask('Checklist ouverture complète')">🌅 Ouverture</button>
  <button class="chip" onclick="ask('Checklist fermeture complète')">🌙 Fermeture</button>
  <button class="chip" onclick="ask('Comment accueillir un client qui arrive ?')">🤝 Accueil</button>
  <button class="chip" onclick="ask('Comment gérer un client qui se plaint ?')">💬 Plainte</button>
  <button class="chip" onclick="ask('Quel vin conseiller avec le Tartare de Bœuf ?')">🍷 Vins</button>
  <button class="chip" onclick="ask('Quels sont nos cocktails signatures ?')">🍸 Cocktails</button>
  <button class="chip" onclick="ask('Que faire en cas de malaise client ?')">🚨 Urgences</button>
  <button class="chip" onclick="ask('Quels sont nos plats principaux et leurs prix ?')">📋 Carte</button>
</div>

<div class="chat" id="chat">
  <div class="welcome">
    <h2>Bienvenue au <em>Shake</em>.</h2>
    <p>Pose-moi n'importe quelle question sur les standards, la carte, les vins ou les procédures.</p>
    <button class="sugg-btn" onclick="ask('Comment accueillir un client qui arrive ?')">→ Comment accueillir un client qui arrive ?</button>
    <button class="sugg-btn" onclick="ask('Quel vin conseiller avec le Magret de Canard ?')">→ Quel vin avec le Magret de Canard ?</button>
    <button class="sugg-btn" onclick="ask('Checklist ouverture salle complète')">→ Checklist ouverture salle complète</button>
    <button class="sugg-btn" onclick="ask('Que faire si un client devient agressif ?')">→ Que faire si un client devient agressif ?</button>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="inp" placeholder="Pose ta question..." rows="1" onkeydown="handleKey(event)" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
    <button id="sendBtn" onclick="send()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#f5f0e8"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="disc">Assistant Le Shake · Standards Jonathan</div>
</div>

<script>
const history = [];

function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }
function ask(q){ document.getElementById('inp').value=q; send(); }

function addMsg(text, isUser){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg'+(isUser?' user':'');
  const av = document.createElement('div');
  av.className = 'avatar '+(isUser?'usr':'bot');
  av.textContent = isUser?'T':'S';
  const bub = document.createElement('div');
  bub.className = 'bubble '+(isUser?'user':'bot');
  bub.innerHTML = isUser ? text : format(text);
  div.appendChild(av); div.appendChild(bub);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function format(t){
  return t.replace(/\*\*(.*?)\*\*/g,'<strong style="color:#c9a84c">$1</strong>')
          .replace(/\n- /g,'<br>• ').replace(/\n/g,'<br>');
}

function showTyping(){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className='msg'; div.id='typing';
  const av=document.createElement('div'); av.className='avatar bot'; av.textContent='S';
  const bub=document.createElement('div'); bub.className='bubble bot';
  bub.innerHTML='<div class="typing"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>';
  div.appendChild(av); div.appendChild(bub);
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}

async function send(){
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if(!text) return;
  addMsg(text, true);
  inp.value=''; inp.style.height='auto';
  history.push({role:'user',content:text});
  showTyping();
  try {
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: history})
    });
    if(!res.ok){
      const err = await res.text();
      throw new Error('Serveur: ' + res.status + ' - ' + err);
    }
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Réponse vide.';
    document.getElementById('typing')?.remove();
    history.push({role:'assistant',content:reply});
    addMsg(reply, false);
  } catch(e){
    document.getElementById('typing')?.remove();
    addMsg('Erreur: ' + e.message, false);
  }
}
</script>
</body>
</html>
